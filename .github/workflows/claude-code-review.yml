name: Claude Code Review

# Independent AI review on every PR — complements the human merge gate. The
# improvement agent (docs/agent/) AUTHORS PRs; this REVIEWS them, so the author is
# never the only check. Advisory only: Claude cannot approve or merge.
#
# Auth: claude_code_oauth_token (set up by `claude /install-github-app` as the
# CLAUDE_CODE_OAUTH_TOKEN repo secret) — no API key, no OIDC wizard required.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The improvement agent authors its PRs as a bot (claude[bot]). Without this,
          # claude-code-action's bot-loop guard refuses to review them — skipping the
          # exact PRs this independent review exists to check. Allow all bots so agent
          # (and e.g. dependabot) PRs still get reviewed. Safe: the review triggers only
          # on pull_request events and just posts a comment, so it cannot re-trigger itself.
          allowed_bots: "*"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}. The branch is checked out; read the diff with
            `gh pr diff ${{ github.event.pull_request.number }}` and
            `gh pr view ${{ github.event.pull_request.number }}`, and open files as
            needed.

            Be concise and specific. Priorities, in order:
            1. Correctness bugs / logic errors in the diff.
            2. Scope: improvement-agent PRs (branch prefix `agent/exp-`) must stay
               within docs/agent/improvement-agent-scope.md — COPY TEXT ONLY. Reject
               on sight any edit to telemetry (src/lib/telemetry.js,
               src/lib/clientTelemetry.js, PageTracker.js, /api/track, or any
               trackClient/trackEvent call or event name), contact-API logic /
               recipient emails / reCAPTCHA, contact-form field name/id attributes,
               GSAP-bound markup structure, src/lib/* logic, infra/**, workbook/**,
               secrets, or .github/workflows/**.
            3. Copy quality: on-brand per BRAND_GUIDELINES.md (refined, warm,
               heritage, understated — never boastful/corporate) and no unkeepable
               promises (no invented response-time SLAs beyond the existing 24–48h,
               no fake "free"/guarantee/discount claims).
            4. Home-page process steps are duplicated (desktop + mobile) in
               src/app/page.js — if one copy changed, flag any un-mirrored twin.
            5. Security issues and obvious performance regressions.

            You MUST post the review to GitHub (do not just print it):
            - a concise top-level summary via
              `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
            - any line-specific issues via the inline-comment tool.
            If the PR looks good, still post a short approving summary comment.
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"'
