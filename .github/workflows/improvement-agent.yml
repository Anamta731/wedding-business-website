name: Improvement Agent

# The autonomous "author" half of the analytics -> improvement loop for Vows &
# Vedas. Every ~3 days, Claude reads the enquiry funnel from App Insights, picks
# the single biggest in-scope leak, makes ONE scoped copy change (per docs/agent/),
# and opens ONE PR assigned to nik-mci for review. It NEVER merges or
# deploys — the Claude PR reviewer + a human are the gate.
#
# Auth model (no new secrets beyond the Claude token):
#   • Azure: reuses the existing OIDC deploy identity (AZURE_CLIENT_ID /
#     AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID) to query App Insights. The SP needs
#     read+query on appi-vows-prod-eus-001 (Contributor on the RG, or Monitoring
#     Reader on the component). See docs/agent/README.md.
#   • Claude: CLAUDE_CODE_OAUTH_TOKEN (set by `claude /install-github-app`).
# If the snapshot errors (no data / missing RBAC), the job fails BEFORE the agent
# runs, so no PR is opened.

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3rd day at 06:00 UTC (~11:30 IST); short gap at month boundaries (cron can't do true 72h)
  workflow_dispatch:        # manual trigger for testing / first-run calibration

permissions:
  contents: write           # push the experiment branch
  pull-requests: write      # open the PR (cannot merge)
  id-token: write           # OIDC login to Azure

jobs:
  improvement-agent:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so the agent can branch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the funnel (App Insights snapshot)
        # Exits non-zero (fails the job -> no PR) if App Insights is unreachable
        # or the identity lacks query rights. Writes 7d + 30d snapshots for Claude.
        run: |
          az extension add -n application-insights --only-show-errors
          node scripts/analytics-snapshot.mjs \
            --app appi-vows-prod-eus-001 --resource-group mci-wedding-website \
            --window 7  > "${RUNNER_TEMP}/snapshot-7d.json"
          node scripts/analytics-snapshot.mjs \
            --app appi-vows-prod-eus-001 --resource-group mci-wedding-website \
            --window 30 > "${RUNNER_TEMP}/snapshot-30d.json"
          echo "=== 7-day snapshot ===";  cat "${RUNNER_TEMP}/snapshot-7d.json"
          echo "=== 30-day snapshot ==="; cat "${RUNNER_TEMP}/snapshot-30d.json"

      - name: Run improvement agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the scheduled improvement agent for the Vows & Vedas website.
            Follow docs/agent/improvement-agent-prompt.md and
            docs/agent/improvement-agent-scope.md EXACTLY, and read
            BRAND_GUIDELINES.md for voice. Summary of this run:

            1. Read the two funnel snapshots already generated for you:
                 ${{ runner.temp }}/snapshot-7d.json   (7-day window)
                 ${{ runner.temp }}/snapshot-30d.json  (30-day window)
               If a snapshot has an "error" field, or primary_leak is null AND
               regressions is empty (every stage at/above target), STOP and do
               nothing — do NOT open a PR.

            2. Read docs/experiments/EXPERIMENTS.md. If ANY row has Status = OPEN
               (its observation window has not closed), STOP and do NOT open a new
               PR — only one experiment runs at a time. (Optional: post the
               snapshot as a comment on that experiment's PR.)

            3. Otherwise pick the SINGLE biggest in-scope leak (a regression takes
               priority; else primary_leak by est_sessions_lost; ignore stages with
               valid:false). Make ONE minimal, scoped, on-brand COPY change strictly
               within docs/agent/improvement-agent-scope.md (text content of existing
               string literals only). Never touch telemetry, contact-API logic,
               recipient emails, reCAPTCHA, form field names, GSAP-bound markup,
               infra, secrets, or workflow files. Remember the home-page process
               steps are duplicated (desktop + mobile) — edit both if you touch them.

            4. Append a row to docs/experiments/EXPERIMENTS.md (date, hypothesis,
               files, primary metric, baseline from the snapshot, target, 14-day
               window, Status OPEN). In the PR column put the BRANCH SLUG (e.g.
               agent/exp-...), NOT a PR number. Do NOT commit the snapshot JSON files
               (they live under the runner temp dir, outside the repo).

            5. Create branch agent/exp-<YYYY-MM-DD>-<slug>. Make EXACTLY ONE commit
               (the copy change + the ledger row together), push it ONCE, then open
               exactly ONE PR with `gh pr create --base main --assignee nik-mci` using
               the body shape in the prompt doc (Evidence -> Hypothesis -> Primary
               metric -> Window -> Rollback). The FIRST line of the PR body MUST be
               "cc @nik-mci — new improvement-agent experiment for review." so GitHub
               notifies the maintainer. Do NOT push any further commits after opening
               the PR (a second push re-triggers CI and races the preview deploy).
               NEVER merge, never push to main, never deploy. Then stop.
          claude_args: '--allowed-tools "Read,Grep,Glob,Edit,Write,Bash"'
